<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Dashboard | MedConnect</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">🏥 MedConnect</a>
      <nav class="nav-links">
        <a href="doctors.html">Find Doctors</a>
        <a href="patient-dashboard.html" class="active">Patient Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem;">
    <h2>My Appointments</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Scheduled medical consultations and telehealth links.</p>

    <div id="appointmentsList" style="display: flex; flex-direction: column; gap: 1rem;"></div>
  </main>

  <script type="module">
    import { ApiService, showToast } from '../js/api/apiService.js';

    async function loadAppointments() {
      const container = document.getElementById('appointmentsList');
      const appointments = await ApiService.get('appointments');

      if (!appointments || appointments.length === 0) {
        container.innerHTML = '<div class="card" style="text-align: center; color: var(--text-muted);">No scheduled appointments found.</div>';
        return;
      }

      container.innerHTML = appointments.map(apt => `
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">ID: ${apt.id}</span>
            <h3 style="font-size: 1.15rem; color: var(--secondary);">${apt.doctorName}</h3>
            <p style="font-size: 0.9rem; margin-top: 0.25rem;">📅 <strong>${apt.date}</strong> at <strong>${apt.time}</strong></p>
            ${apt.notes ? `<p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.4rem; background: var(--bg-light); padding: 0.4rem 0.6rem; border-radius: 4px;">📝 Notes: ${apt.notes}</p>` : ''}
          </div>
          <div>
            ${apt.mode === 'Video' ? `<button class="btn btn-call">🎥 Join Video Call</button>` : `<span class="badge badge-inperson">In-Person Visit</span>`}
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadAppointments);
  </script>
</body>
</html>

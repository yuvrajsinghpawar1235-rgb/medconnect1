<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Doctors | MedConnect</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">🏥 MedConnect</a>
      <nav class="nav-links">
        <a href="doctors.html" class="active">Find Doctors</a>
        <a href="patient-dashboard.html">Patient Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem;">
    <div>
      <h2 style="font-size: 1.8rem; color: #0f172a;">Doctor Directory</h2>
      <p style="color: #64748b;">Select a physician to schedule an in-person or virtual consultation.</p>
    </div>

    <div class="filters-bar" style="margin: 1.5rem 0; display: flex; gap: 1rem; flex-wrap: wrap;">
      <input type="text" id="searchInput" placeholder="Search doctor name or specialty..." class="form-control" style="flex: 2; min-width: 200px;">
      <select id="specializationFilter" class="form-control" style="flex: 1; min-width: 160px;">
        <option value="">All Specializations</option>
      </select>
    </div>

    <div id="doctorsList" class="grid-3"></div>
  </main>

  <!-- Interactive Booking Modal -->
  <div id="bookingModal" class="modal-overlay">
    <div class="modal-card">
      <div style="margin-bottom: 1.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 1rem;">
        <h3 id="modalDocName" class="modal-title">Book Appointment</h3>
        <p id="modalDocSpec" style="color: #0284c7; font-weight: 600; font-size: 0.9rem; margin-top: 0.2rem;"></p>
      </div>

      <form id="bookingForm">
        <input type="hidden" id="modalDocId">
        
        <div class="form-group">
          <label for="bookDate">Consultation Date</label>
          <input type="date" id="bookDate" class="form-control" required min="2026-09-06">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="bookTime">Time Slot</label>
            <select id="bookTime" class="form-control" required>
              <option value="09:00 AM">09:00 AM</option>
              <option value="10:30 AM">10:30 AM</option>
              <option value="02:00 PM">02:00 PM</option>
              <option value="04:15 PM">04:15 PM</option>
            </select>
          </div>

          <div class="form-group">
            <label for="bookMode">Visit Type</label>
            <select id="bookMode" class="form-control" required>
              <option value="Video">Video Call</option>
              <option value="In-person">In-Person</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="bookNotes">Symptoms & Patient Notes</label>
          <textarea id="bookNotes" class="form-control" rows="3" placeholder="Describe symptoms or medical notes..."></textarea>
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" id="closeModal" class="btn btn-outline" style="flex: 1;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex: 1.5;">Confirm Visit</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { ApiService, showToast } from '../js/api/apiService.js';

    let doctors = [];

    async function init() {
      try {
        localStorage.removeItem('med_doctors');
        doctors = await ApiService.get('doctors');
        const specs = await ApiService.get('specializations');

        const select = document.getElementById('specializationFilter');
        specs.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          select.appendChild(opt);
        });

        render(doctors);
      } catch (err) {
        showToast('Failed to load doctors list', 'error');
      }
    }

    function render(list) {
      const container = document.getElementById('doctorsList');
      if (!list || list.length === 0) {
        container.innerHTML = '<p style="color: #64748b;">No doctors found matching criteria.</p>';
        return;
      }

      container.innerHTML = list.map(doc => `
        <div class="card">
          <div class="doctor-header">
            <img src="${doc.image}" alt="${doc.name}" class="doctor-avatar">
            <div>
              <h3 style="color: #0f172a; font-size: 1.15rem; margin: 0;">${doc.name}</h3>
              <p style="color: #0284c7; font-weight: 600; font-size: 0.9rem; margin: 0.2rem 0 0 0;">${doc.specialization}</p>
            </div>
          </div>
          <p style="font-size: 0.85rem; color: #64748b; margin: 0.5rem 0;">${doc.experience} Yrs Experience • ⭐ ${doc.rating}</p>
          <p style="font-size: 0.9rem; font-weight: 600; margin: 0;">Fee: $${doc.fee}</p>
          <button class="btn btn-primary book-trigger" data-id="${doc.id}" style="width: 100%; margin-top: 1rem;">Book Appointment</button>
        </div>
      `).join('');

      document.querySelectorAll('.book-trigger').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const doc = doctors.find(d => d.id === e.target.dataset.id);
          document.getElementById('modalDocId').value = doc.id;
          document.getElementById('modalDocName').textContent = `Book with ${doc.name}`;
          document.getElementById('modalDocSpec').textContent = `${doc.specialization} • $${doc.fee}`;
          document.getElementById('bookingModal').classList.add('active');
        });
      });
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('bookingModal').classList.remove('active');
    });

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newAppointment = {
        id: `APT-${Math.floor(1000 + Math.random() * 9000)}`,
        doctorId: document.getElementById('modalDocId').value,
        doctorName: document.getElementById('modalDocName').textContent.replace('Book with ', ''),
        date: document.getElementById('bookDate').value,
        time: document.getElementById('bookTime').value,
        mode: document.getElementById('bookMode').value,
        notes: document.getElementById('bookNotes').value
      };

      await ApiService.post('appointments', newAppointment);
      document.getElementById('bookingModal').classList.remove('active');
      showToast('Appointment successfully scheduled!', 'success');
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

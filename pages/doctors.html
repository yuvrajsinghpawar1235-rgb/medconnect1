<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Doctors | MedConnect</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">🏥 MedConnect</a>
      <nav class="nav-links">
        <a href="doctors.html" class="active">Find Doctors</a>
        <a href="patient-dashboard.html">Patient Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem;">
    <div>
      <h2 style="font-size: 1.8rem; color: var(--secondary);">Doctor Directory</h2>
      <p style="color: var(--text-muted);">Select a physician to schedule an in-person or virtual consultation.</p>
    </div>

    <div class="filters-bar">
      <input type="text" id="searchInput" placeholder="Search doctor name or specialty..." class="input-field" style="flex: 2;">
      <select id="specializationFilter" class="input-field" style="flex: 1;">
        <option value="">All Specializations</option>
      </select>
    </div>

    <div id="doctorsList" class="grid-3"></div>
  </main>

  <!-- Interactive Booking Modal -->
  <div id="bookingModal" class="modal-overlay">
    <div class="modal-card">
      <h3 id="modalDocName" style="color: var(--secondary); margin-bottom: 0.25rem;">Book Appointment</h3>
      <p id="modalDocSpec" style="color: var(--primary); font-size: 0.9rem; margin-bottom: 1.5rem;"></p>

      <form id="bookingForm">
        <input type="hidden" id="modalDocId">
        
        <div class="form-group">
          <label for="bookDate">Select Date</label>
          <input type="date" id="bookDate" class="form-control" required min="2026-08-30">
        </div>

        <div class="form-group">
          <label for="bookTime">Select Time Slot</label>
          <select id="bookTime" class="form-control" required>
            <option value="09:00 AM">09:00 AM</option>
            <option value="10:30 AM">10:30 AM</option>
            <option value="02:00 PM">02:00 PM</option>
            <option value="04:15 PM">04:15 PM</option>
          </select>
        </div>

        <div class="form-group">
          <label for="bookMode">Consultation Type</label>
          <select id="bookMode" class="form-control" required>
            <option value="Video">Video Call</option>
            <option value="In-person">In-Person Visit</option>
          </select>
        </div>

        <div class="form-group">
          <label for="bookNotes">Symptoms / Patient Notes</label>
          <textarea id="bookNotes" class="form-control" rows="3" placeholder="Describe symptoms or medical history details..."></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" id="closeModal" class="btn btn-outline" style="flex: 1;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex: 1;">Confirm Booking</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { ApiService, showToast } from '../js/api/apiService.js';

    let doctors = [];

    async function init() {
      const container = document.getElementById('doctorsList');
      try {
        doctors = await ApiService.get('doctors');
        const specs = await ApiService.get('specializations');

        const select = document.getElementById('specializationFilter');
        specs.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          select.appendChild(opt);
        });

        render(doctors);
      } catch (err) {
        showToast('Error loading doctor dataset', 'error');
      }
    }

    function render(list) {
      const container = document.getElementById('doctorsList');
      container.innerHTML = list.map(doc => `
        <div class="card">
          <div class="doctor-header">
            <img src="${doc.image}" alt="${doc.name}" class="doctor-avatar">
            <div>
              <h3 style="color: var(--secondary); font-size: 1.15rem;">${doc.name}</h3>
              <p style="color: var(--primary); font-weight: 600; font-size: 0.9rem;">${doc.specialization}</p>
            </div>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted);">${doc.experience} Yrs Experience • ⭐ ${doc.rating}</p>
          <p style="font-size: 0.9rem; font-weight: 600; margin-top: 0.2rem;">Fee: $${doc.fee}</p>
          <button class="btn btn-primary book-trigger" data-id="${doc.id}" style="width: 100%; margin-top: 1rem;">Book Appointment</button>
        </div>
      `).join('');

      document.querySelectorAll('.book-trigger').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const doc = doctors.find(d => d.id === e.target.dataset.id);
          document.getElementById('modalDocId').value = doc.id;
          document.getElementById('modalDocName').textContent = `Book with ${doc.name}`;
          document.getElementById('modalDocSpec').textContent = `${doc.specialization} • $${doc.fee}`;
          document.getElementById('bookingModal').classList.add('active');
        });
      });
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('bookingModal').classList.remove('active');
    });

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newAppointment = {
        id: `APT-${Math.floor(1000 + Math.random() * 9000)}`,
        doctorId: document.getElementById('modalDocId').value,
        doctorName: document.getElementById('modalDocName').textContent.replace('Book with ', ''),
        date: document.getElementById('bookDate').value,
        time: document.getElementById('bookTime').value,
        mode: document.getElementById('bookMode').value,
        notes: document.getElementById('bookNotes').value
      };

      await ApiService.post('appointments', newAppointment);
      document.getElementById('bookingModal').classList.remove('active');
      showToast('Appointment successfully scheduled!', 'success');
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

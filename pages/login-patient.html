<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal Login | MedConnect</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-icon {
      background: #e0f2fe;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 1rem;
      color: #0284c7;
    }

    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 0.4rem;
    }

    .auth-header p {
      color: #64748b;
      font-size: 0.9rem;
      margin: 0;
    }

    /* Demo Quick-Fill Box */
    .demo-box {
      background-color: #f1f5f9;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 0.85rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-info {
      font-size: 0.8rem;
      color: #475569;
      line-height: 1.4;
    }

    .btn-demo-fill {
      background: #0284c7;
      color: white;
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-demo-fill:hover {
      background: #0369a1;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-submit {
      width: 100%;
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: #0369a1;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.8rem;
      padding-top: 1.25rem;
      border-top: 1px solid #f1f5f9;
      font-size: 0.85rem;
      color: #64748b;
    }

    .auth-footer a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">🏥 MedConnect</a>
      <nav class="nav-links">
        <a href="login-doctor.html" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Doctor Portal</a>
      </nav>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">👤</div>
        <h1>Patient Login</h1>
        <p>Access your health records & appointments</p>
      </div>

      <!-- Quick Fill Demo Credentials -->
      <div class="demo-box">
        <div class="demo-info">
          <strong>Demo Patient:</strong><br>
          rahul.patel@gmail.com
        </div>
        <button type="button" id="fillDemoBtn" class="btn-demo-fill">Auto-Fill ⚡</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="rahul.patel@gmail.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
          />
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register Here</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { authenticateUser, getSession, showToast } from '../js/api/apiService.js';

    // Auto-redirect if already logged in
    const activeSession = getSession();
    if (activeSession && activeSession.role === 'patient') {
      window.location.href = 'patient-dashboard.html';
    }

    // Auto-fill demo button
    document.getElementById('fillDemoBtn').addEventListener('click', () => {
      document.getElementById('email').value = 'rahul.patel@gmail.com';
      document.getElementById('password').value = 'password123';
      showToast('Demo credentials filled!', 'success');
    });

    const form = document.getElementById('loginForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      const result = authenticateUser(email, password, 'patient');

      if (result.success) {
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'patient-dashboard.html';
        }, 800);
      } else {
        showToast(result.message, 'error');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration | MedConnect</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-icon {
      background: #e0f2fe;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 0.75rem;
      color: #0284c7;
    }

    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 0.3rem;
    }

    .auth-header p {
      color: #64748b;
      font-size: 0.88rem;
      margin: 0;
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-submit {
      width: 100%;
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: #0369a1;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #f1f5f9;
      font-size: 0.85rem;
      color: #64748b;
    }

    .auth-footer a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">🏥 MedConnect</a>
      <nav class="nav-links">
        <a href="login-patient.html" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Patient Login</a>
      </nav>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">📝</div>
        <h1>Create Patient Account</h1>
        <p>Sign up to start booking appointments online</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input 
            type="text" 
            id="fullName" 
            class="form-control" 
            placeholder="e.g. Alex Johnson" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="e.g. alex.johnson@gmail.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="At least 6 characters" 
            required 
            minlength="6"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-control" 
            placeholder="Re-enter password" 
            required 
          />
        </div>

        <button type="submit" class="btn-submit">Register Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login-patient.html">Log In Here</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { registerUser, setSession, showToast } from '../js/api/apiService.js';

    const form = document.getElementById('registerForm');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      // 1. Password verification check
      if (password !== confirmPassword) {
        showToast('Passwords do not match!', 'error');
        return;
      }

      // 2. Build new Patient User Object
      const newPatient = {
        id: 'PAT-' + Date.now().toString().slice(-4),
        name: name,
        email: email,
        password: password,
        role: 'patient'
      };

      // 3. Register user via apiService
      const result = registerUser(newPatient);

      if (result.success) {
        // Auto-login the user into local session
        setSession(newPatient);
        showToast('Account created successfully! Logging you in...', 'success');

        setTimeout(() => {
          window.location.href = 'patient-dashboard.html';
        }, 1000);
      } else {
        showToast(result.message, 'error');
      }
    });
  </script>
</body>
</html>

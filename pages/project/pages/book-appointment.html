<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment | MedConnect</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">MedConnect</a>
      <nav class="nav-links">
        <a href="doctors.html">Find Doctors</a>
        <a href="patient-dashboard.html">Patient Dashboard</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 600px; margin: 40px auto; padding: 0 20px;">
    <div class="card" id="booking-card">
      <h2 style="margin-bottom: 16px;">Book Appointment</h2>
      
      <div id="doctor-summary" style="margin-bottom: 20px;">
        <p style="color: var(--text-muted);">Loading doctor details...</p>
      </div>

      <form id="booking-form">
        <div class="filter-group">
          <label for="booking-date">Select Consultation Date</label>
          <input type="date" id="booking-date" required>
        </div>

        <div class="filter-group" style="margin-top: 15px;">
          <label>Select Time Slot</label>
          <div id="slots-container" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px;">
            <p style="color:var(--text-muted); font-size:0.9rem;">Please choose a date above to load available slots.</p>
          </div>
        </div>

        <div class="filter-group" style="margin-top: 15px;">
          <label for="booking-reason">Reason for Visit</label>
          <textarea id="booking-reason" rows="3" placeholder="Briefly state your medical concern..." required></textarea>
        </div>

        <button type="submit" id="confirm-btn" class="btn btn-primary" style="width: 100%; margin-top: 20px;" disabled>Confirm Booking</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { ApiService } from '../js/api/apiService.js';
    import { AuthService } from '../js/services/authService.js';
    import { Toast } from '../js/components/toast.js';
    import { DateUtils } from '../js/utils/dateUtils.js';
    import { SlotManager } from '../js/scheduling/slotManager.js';

    let selectedDoctor = null;
    let selectedTimeSlot = null;

    async function initPage() {
      // Authenticate session
      const session = AuthService.protectRoute('patient');
      if (!session) return;

      const urlParams = new URLSearchParams(window.location.search);
      const doctorId = urlParams.get('doctorId');

      const docSummary = document.getElementById('doctor-summary');
      const dateInput = document.getElementById('booking-date');

      // Set date picker minimum to today's date
      if (dateInput) {
        const todayStr = new Date().toISOString().split('T')[0];
        dateInput.min = todayStr;
      }

      if (!doctorId) {
        docSummary.innerHTML = `<p style="color:#dc2626;">No doctor selected. <a href="doctors.html">Browse Doctors List</a></p>`;
        return;
      }

      try {
        selectedDoctor = await ApiService.getDoctorById(doctorId);
        
        const docName = selectedDoctor.name.startsWith('Dr.') ? selectedDoctor.name : `Dr. ${selectedDoctor.name}`;
        
        docSummary.innerHTML = `
          <div style="display: flex; gap: 15px; align-items: center; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid var(--border);">
            <img src="${selectedDoctor.image}" style="width:65px; height:65px; border-radius:50%; object-fit:cover;" alt="${docName}">
            <div>
              <h3 style="margin:0; font-size:1.1rem;">${docName}</h3>
              <p style="margin:2px 0; color:var(--primary); font-size:0.9rem; font-weight:600;">${selectedDoctor.specialization}</p>
              <p style="margin:0; font-size:0.85rem; color:var(--text-muted);">${selectedDoctor.clinic} | Fee: ₹${selectedDoctor.fee}</p>
            </div>
          </div>
        `;
      } catch (err) {
        docSummary.innerHTML = `<p style="color:#dc2626;">Failed to load doctor details. Please check server connection.</p>`;
      }

      dateInput.addEventListener('change', loadSlots);
      document.getElementById('booking-form').addEventListener('submit', handleBookingSubmit);
    }

    async function loadSlots() {
      const dateVal = document.getElementById('booking-date').value;
      const slotsContainer = document.getElementById('slots-container');
      const confirmBtn = document.getElementById('confirm-btn');

      if (!dateVal || !selectedDoctor) return;

      slotsContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Checking slots...</p>';
      selectedTimeSlot = null;
      confirmBtn.disabled = true;

      try {
        let allAppointments = [];
        try {
          allAppointments = await ApiService.getAppointments() || [];
        } catch (e) {
          console.warn('Could not fetch existing appointments, defaulting to full availability.', e);
        }

        const docAppointments = allAppointments.filter(a => String(a.doctorId) === String(selectedDoctor.id));
        const availableSlots = SlotManager.getAvailableSlots(docAppointments, dateVal);

        if (!availableSlots || availableSlots.length === 0) {
          slotsContainer.innerHTML = `<p style="color:#dc2626; font-size:0.9rem;">No available slots for this date.</p>`;
          return;
        }

        slotsContainer.innerHTML = availableSlots.map(slot => `
          <button type="button" class="btn btn-outline btn-sm slot-btn" data-slot="${slot}">${slot}</button>
        `).join('');

        document.querySelectorAll('.slot-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.slot-btn').forEach(b => {
              b.classList.remove('btn-primary');
              b.classList.add('btn-outline');
            });
            e.target.classList.remove('btn-outline');
            e.target.classList.add('btn-primary');
            selectedTimeSlot = e.target.dataset.slot;
            confirmBtn.disabled = false;
          });
        });
      } catch (err) {
        slotsContainer.innerHTML = `<p style="color:#dc2626; font-size:0.9rem;">Error rendering time slots.</p>`;
      }
    }

    async function handleBookingSubmit(e) {
      e.preventDefault();
      const session = AuthService.getSession();
      const date = document.getElementById('booking-date').value;
      const reason = document.getElementById('booking-reason').value;

      if (!selectedTimeSlot) {
        Toast.show('Please select a time slot to continue.', 'error');
        return;
      }

      const appointmentData = {
        id: `app_${Date.now()}`,
        patientId: session.user.id,
        patientName: session.user.name,
        doctorId: selectedDoctor.id,
        doctorName: selectedDoctor.name,
        specialization: selectedDoctor.specialization,
        date,
        time: selectedTimeSlot,
        status: 'Upcoming',
        fee: selectedDoctor.fee,
        mode: selectedDoctor.mode,
        reason
      };

      try {
        await ApiService.createAppointment(appointmentData);
        Toast.show('Appointment successfully booked!', 'success');
        setTimeout(() => {
          window.location.href = 'patient-dashboard.html';
        }, 1200);
      } catch (err) {
        Toast.show('Failed to record appointment. Try again.', 'error');
      }
    }

    initPage();
  </script>
</body>
</html>

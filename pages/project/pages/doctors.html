<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Doctors | MedConnect</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">MedConnect</a>
      <nav class="nav-links">
        <a href="doctors.html" class="active">Find Doctors</a>
        <a href="patient-dashboard.html">Patient Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="directory-container">
    <aside class="filter-sidebar">
      <h3>Filter Specialists</h3>
      
      <div class="filter-group">
        <label for="search-input">Search Doctor / Clinic</label>
        <input type="text" id="search-input" placeholder="e.g. Patel, HeartCare">
      </div>

      <div class="filter-group">
        <label for="specialization-select">Specialization</label>
        <select id="specialization-select">
          <option value="all">All Specializations</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="mode-select">Consultation Mode</label>
        <select id="mode-select">
          <option value="all">All Modes</option>
          <option value="In-person">In-person</option>
          <option value="Video">Video Consultation</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="sort-select">Sort By</label>
        <select id="sort-select">
          <option value="rating-desc">Rating: High to Low</option>
          <option value="exp-desc">Experience: High to Low</option>
          <option value="fee-asc">Fee: Low to High</option>
        </select>
      </div>
    </aside>

    <section class="doctors-list-section">
      <div id="doctors-grid" class="doctors-grid">Loading doctors...</div>
      
      <div id="pagination-controls" style="display:flex; justify-content:center; gap:10px; margin-top:25px;">
        <button id="prev-page" class="btn btn-outline">Previous</button>
        <span id="page-indicator" style="align-self:center; font-weight:600;">Page 1</span>
        <button id="next-page" class="btn btn-outline">Next</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { ApiService } from '../js/api/apiService.js';

    async function initDirectory() {
      const grid = document.getElementById('doctors-grid');
      const specSelect = document.getElementById('specialization-select');
      const searchInput = document.getElementById('search-input');
      const modeSelect = document.getElementById('mode-select');
      const sortSelect = document.getElementById('sort-select');
      const prevBtn = document.getElementById('prev-page');
      const nextBtn = document.getElementById('next-page');
      const pageIndicator = document.getElementById('page-indicator');

      let currentPage = 1;
      const itemsPerPage = 6;
      let currentFilteredList = [];

      try {
        const [doctors, specs] = await Promise.all([
          ApiService.getDoctors(),
          ApiService.request('/specializations')
        ]);

        specs.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.name;
          opt.textContent = s.name;
          specSelect.appendChild(opt);
        });

        function renderPage() {
          const start = (currentPage - 1) * itemsPerPage;
          const paginatedList = currentFilteredList.slice(start, start + itemsPerPage);
          const totalPages = Math.ceil(currentFilteredList.length / itemsPerPage) || 1;

          pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;
          prevBtn.disabled = currentPage === 1;
          nextBtn.disabled = currentPage >= totalPages;

          if (!paginatedList.length) {
            grid.innerHTML = '<p>No doctors match your criteria.</p>';
            return;
          }

          grid.innerHTML = paginatedList.map(doc => `
            <div class="card doctor-card">
              <img src="${doc.image}" alt="${doc.name}" class="doc-avatar">
              <div class="doc-info">
                <h3 style="margin-bottom:4px;">${doc.name}</h3>
                <p class="badge">${doc.specialization}</p>
                <p style="margin-top:6px;"><strong>Exp:</strong> ${doc.experience} yrs | <strong>Rating:</strong> ⭐ ${doc.rating} (${doc.reviewCount})</p>
                <p><strong>Fee:</strong> ₹${doc.fee} | <strong>Mode:</strong> ${doc.mode}</p>
                <small style="color:var(--text-muted); display:block; margin-top:4px;">${doc.clinic}</small>
                <a href="booking.html?doctorId=${doc.id}" class="btn btn-primary btn-sm" style="margin-top:12px; width:100%;">Book Appointment</a>
              </div>
            </div>
          `).join('');
        }

        function applyFilterAndSort() {
          const search = searchInput.value.toLowerCase();
          const spec = specSelect.value;
          const mode = modeSelect.value;
          const sort = sortSelect.value;

          currentFilteredList = doctors.filter(d => {
            const matchesSearch = d.name.toLowerCase().includes(search) || d.clinic.toLowerCase().includes(search);
            const matchesSpec = spec === 'all' || d.specialization === spec;
            const matchesMode = mode === 'all' || d.mode === mode;
            return matchesSearch && matchesSpec && matchesMode;
          });

          if (sort === 'rating-desc') {
            currentFilteredList.sort((a, b) => b.rating - a.rating);
          } else if (sort === 'exp-desc') {
            currentFilteredList.sort((a, b) => b.experience - a.experience);
          } else if (sort === 'fee-asc') {
            currentFilteredList.sort((a, b) => a.fee - b.fee);
          }

          currentPage = 1;
          renderPage();
        }

        searchInput.addEventListener('input', applyFilterAndSort);
        specSelect.addEventListener('change', applyFilterAndSort);
        modeSelect.addEventListener('change', applyFilterAndSort);
        sortSelect.addEventListener('change', applyFilterAndSort);

        prevBtn.addEventListener('click', () => {
          if (currentPage > 1) {
            currentPage--;
            renderPage();
          }
        });

        nextBtn.addEventListener('click', () => {
          const totalPages = Math.ceil(currentFilteredList.length / itemsPerPage);
          if (currentPage < totalPages) {
            currentPage++;
            renderPage();
          }
        });

        applyFilterAndSort();
      } catch (err) {
        grid.innerHTML = '<p class="error">Failed to load doctor listings.</p>';
      }
    }

    initDirectory();
  </script>
</body>
</html>

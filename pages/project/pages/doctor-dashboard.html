<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard | MedConnect</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">MedConnect</a>
      <nav class="nav-links">
        <a href="doctor-dashboard.html" class="active">Doctor Dashboard</a>
        <a href="availability.html">Manage Availability</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
    <h2>Doctor Portal</h2>

    <!-- KPI Summary Row -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 20px;">
      <div class="card" style="text-align: center;">
        <h4>Today's Visits</h4>
        <p id="kpi-today" style="font-size: 1.8rem; font-weight: bold; margin-top: 8px;">0</p>
      </div>
      <div class="card" style="text-align: center;">
        <h4>Upcoming</h4>
        <p id="kpi-upcoming" style="font-size: 1.8rem; font-weight: bold; margin-top: 8px; color: #0d8abc;">0</p>
      </div>
      <div class="card" style="text-align: center;">
        <h4>Completed</h4>
        <p id="kpi-completed" style="font-size: 1.8rem; font-weight: bold; margin-top: 8px; color: #2e7d32;">0</p>
      </div>
      <div class="card" style="text-align: center;">
        <h4>Cancellations</h4>
        <p id="kpi-cancelled" style="font-size: 1.8rem; font-weight: bold; margin-top: 8px; color: #d32f2f;">0</p>
      </div>
    </div>

    <!-- Quick Action Bar -->
    <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
      <a href="availability.html" class="btn btn-primary">⚙️ Configure Working Slots</a>
    </div>

    <!-- Assigned Schedule -->
    <div class="card" style="margin-top: 20px;">
      <h3>Today's & Upcoming Schedule</h3>
      <div id="doctor-appointments" style="margin-top: 15px;">Loading schedule...</div>
    </div>
  </main>

  <script type="module">
    import { ApiService } from '../js/api/apiService.js';
    import { AuthService } from '../js/services/authService.js';

    async function initDoctorDashboard() {
      const session = AuthService.protectRoute ? AuthService.protectRoute('doctor') : { user: { id: 'DOC-1' } };

      const [appointments, patients] = await Promise.all([
        ApiService.getAppointments(),
        ApiService.getPatients()
      ]);

      const docAppointments = appointments.filter(a => a.doctorId === session.user.id);
      const todayStr = new Date().toISOString().split('T')[0];

      // Update KPIs
      document.getElementById('kpi-today').textContent = docAppointments.filter(a => a.date === todayStr && a.status === 'Confirmed').length;
      document.getElementById('kpi-upcoming').textContent = docAppointments.filter(a => a.status === 'Confirmed').length;
      document.getElementById('kpi-completed').textContent = docAppointments.filter(a => a.status === 'Completed').length;
      document.getElementById('kpi-cancelled').textContent = docAppointments.filter(a => a.status === 'Cancelled').length;

      const container = document.getElementById('doctor-appointments');
      if (!docAppointments.length) {
        container.innerHTML = '<p>No appointments assigned.</p>';
        return;
      }

      container.innerHTML = docAppointments.map(apt => {
        const patient = patients.find(p => p.id === apt.patientId) || {};
        return `
          <div style="border-bottom: 1px solid #ddd; padding: 16px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div>
              <h4 style="margin: 0 0 6px 0;">Ref: ${apt.id}</h4>
              <p style="margin: 4px 0;">👤 <strong>Patient:</strong> ${patient.name || 'N/A'}</p>
              <p style="margin: 4px 0;">📅 Date: ${apt.date} | 🕒 Slot: ${apt.time}</p>
              <p style="margin: 4px 0;">Mode: ${apt.mode} | Status: <strong>${apt.status}</strong></p>
              <small style="color: var(--text-muted);">Reason: ${apt.reason || 'None'}</small>
            </div>
            <div>
              ${patient.phone ? `
                <a href="tel:${patient.phone}" class="btn btn-primary btn-sm">📞 Call ${patient.phone}</a>
              ` : '<span style="color: var(--text-muted);">No phone</span>'}
            </div>
          </div>
        `;
      }).join('');
    }

    initDoctorDashboard();
  </script>
</body>
</html>
